version: '3.8'

services:
  wechat-content:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wechat-content
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-8080}:8080"
    environment:
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=8080
      - FLASK_DEBUG=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：使用Nginx作为反向代理
  nginx:
    image: nginx:alpine
    container_name: wechat-content-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - wechat-content
    profiles:
      - with-nginx
